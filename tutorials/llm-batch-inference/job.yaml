name: llm-batch-inference
entrypoint: python batch_inference_text.py
image_uri: anyscale/ray-llm:2.55.1-py311-cu128
compute_config:
  head_node:
    required_resources:
      CPU: 8
      memory: 32Gi
  worker_nodes:
    - required_resources:
        CPU: 8
        memory: 32Gi
        GPU: 1
      min_nodes: 0
      max_nodes: 10
working_dir: .
max_retries: 2
